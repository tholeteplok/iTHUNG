name: mathmo_app
description: "Speed Math Game — Melatih fluency aritmatika lewat gameplay adaptif."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  riverpod_annotation: ^2.6.1
  tabler_icons_plus: ^3.46.0
  uuid: ^4.6.0
  audioplayers: ^6.7.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.2.1
  device_info_plus: ^11.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.5.4
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5
  hive_ce_generator: ^1.9.2
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_launcher.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/level_bands.json
    - assets/images/
    - assets/images/avatar/
    - assets/images/challenges/
    - assets/sounds/musics/
    - assets/sounds/sfx/
    - assets/icon/

  fonts:
    - family: CoffeeSpark
      fonts:
        - asset: "assets/font/coffee_spark/Coffee Spark.ttf"
    - family: Catboo
      fonts:
        - asset: assets/font/catboo/Catboo.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/font/jetbrains/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/font/jetbrains/JetBrainsMono-ExtraBold.ttf
          weight: 800


